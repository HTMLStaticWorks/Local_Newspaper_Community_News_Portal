<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <title>NEWZ Subscriber Registration — Join the Community</title>
  <meta name="description" content="Register for a NEWZ subscription account to read community updates, manage print routes, or submit classified postings.">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background-color: var(--color-bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box; overflow-y: auto;">

  <!-- Theme and RTL Controls -->
  <div class="auth-controls">
    <button class="rtl-toggle-btn" aria-label="Toggle RTL Direction"><i data-lucide="arrow-left-right"></i></button>
    <button class="theme-toggle-btn" aria-label="Toggle Theme Color"><i data-lucide="moon"></i></button>
  </div>

  <div class="auth-card" style="max-width: 520px; padding: 40px 48px;">
    <header class="auth-header" style="margin-bottom: 24px;">
      <a href="index.html" class="auth-logo" style="text-decoration: none; color: inherit; display: inline-block;">[NEWZ]</a>
      <div class="auth-tagline">Create Subscriber Account</div>
    </header>

    <form id="register-form" data-validate="true">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="register-name" class="form-label">Full Name</label>
        <input type="text" id="register-name" class="form-control" placeholder="Jane Doe" required>
        <div class="error-message">Name cannot be left blank.</div>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label for="register-email" class="form-label">Email Address</label>
        <input type="email" id="register-email" class="form-control" placeholder="reader@example.com" required>
        <div class="error-message">Please enter a valid email address.</div>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required>
        <div class="error-message">Password must be at least 8 characters.</div>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" id="confirm_password" class="form-control" placeholder="Confirm your password" required>
        <div class="error-message">Passwords must match.</div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-checkbox-label">
          <input type="checkbox" required>
          <span>I accept the Terms & Conditions and Privacy Policy</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="padding: 14px 28px;">Register</button>
    </form>

    <div class="oauth-divider">or continue with</div>

    <!-- Continue with Google Button -->
    <button class="oauth-btn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <!-- Continue with Apple Button -->
    <button class="oauth-btn" type="button">
      <svg viewBox="0 0 18 18" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M15.56 9.4c-.03-2.18 1.8-3.22 1.88-3.27-1.02-1.49-2.6-1.69-3.16-1.73-1.34-.14-2.62.79-3.3.79-.68 0-1.74-.77-2.86-.75-1.47.02-2.83.86-3.59 2.17-1.53 2.65-.39 6.57 1.1 8.72.73 1.05 1.59 2.22 2.73 2.18 1.1-.04 1.51-.71 2.83-.71s1.7.71 2.85.69c1.17-.02 1.94-1.06 2.66-2.12.83-1.22 1.18-2.4 1.2-2.46-.02-.01-2.3-.88-2.32-3.5zM12.97 3.02c.6-1.07.41-2.14.36-2.34-.9.08-1.99.64-2.64 1.4-.55.63-1.03 1.73-.89 2.78.99.08 2.02-.49 2.62-1.4c.08-.09.34-.41.55-.44z"/>
      </svg>
      <span>Continue with Apple</span>
    </button>

    <div class="auth-switch">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
</body>
</html>
